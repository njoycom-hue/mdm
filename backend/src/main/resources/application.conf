ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.safecircle.backend.ApplicationKt.module ]
    }
}

database {
    jdbcUrl = "jdbc:postgresql://localhost:5432/safecircle"
    jdbcUrl = ${?DATABASE_URL}
    user = "safecircle"
    user = ${?DATABASE_USER}
    password = "safecircle"
    password = ${?DATABASE_PASSWORD}
}

auth {
    jwtSecret = "dev-secret-change-me"
    jwtSecret = ${?JWT_SECRET}
    jwtIssuer = "safecircle-backend"
    jwtAudience = "safecircle-app"
}
