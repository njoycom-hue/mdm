name: OCI 백엔드 배포

# duruone 저장소의 OCI 배포 워크플로우와 같은 SSH 방식(OCI_HOST/OCI_USER/OCI_SSH_KEY)을
# 따르되, 이 저장소 secrets에는 별도로 등록해야 합니다(시크릿은 저장소별로 독립적이라
# duruone에 등록된 값이 자동으로 여기 넘어오지 않습니다). 같은 OCI 서버를 함께 쓰는
# 경우, duruone과 동일한 호스트/계정 값을 그대로 다시 등록하면 됩니다.
#
# duruone(raw PHP+systemd 배포)과 달리 이 백엔드는 처음부터 Docker Compose로 싸여
# 있습니다 — 나중에 다른 서버·다른 클라우드로 옮길 때 이 워크플로우의 배포 대상 몇
# 줄(OCI_HOST 등)만 바꾸면 되고, 서버 쪽 설정은 "docker compose up -d"로 그대로
# 재현됩니다. 같은 이유로 배포 디렉터리도 duruone의 /var/www/duruone과 완전히
# 분리된 /opt/safecircle-backend를 씁니다 — 포트/의존성 충돌 없이 같은 OCI 인스턴스에
# 얹혀 살 수 있습니다.
#
# 이미지는 OCI 서버가 아니라 이 GitHub Actions 러너(무료 공용 인프라)에서 빌드합니다.
# OCI 서버는 Ampere A1(ARM64)이고 이 러너는 x86_64라서 buildx+QEMU로 linux/arm64를
# 크로스 빌드한 뒤 이미지를 tar로 저장해 OCI로 옮기고 그쪽에서는 "docker load"만
# 합니다 — 즉 OCI 서버는 컴파일을 전혀 하지 않습니다. (예전 버전은 OCI 서버에서
# "docker compose up -d --build"로 직접 컴파일했는데, Gradle/Kotlin 컴파일이 CPU를
# 많이 써서 운영 서버 부하 스파이크로 이어질 수 있어 이렇게 옮겼습니다.)
#
# 사전 준비 (Settings → Secrets and variables → Actions):
#   OCI_HOST / OCI_USER / OCI_SSH_KEY : OCI 인스턴스 접속 정보 (duruone과 같은 서버면
#                                        같은 값, 새 서버면 새로 발급)
#   OCI_SSH_PASSPHRASE                : (선택) 개인키가 비밀번호로 잠겨있는 경우에만 등록.
#                                        잠겨있지 않은 키면 이 시크릿 자체를 등록하지 않아도 됨
#                                        (비어있으면 자동으로 무시됨).
#   DATABASE_PASSWORD                 : 운영 Postgres 비밀번호 (최초 1회 정하면 이후 고정)
#   JWT_SECRET                        : 운영 JWT 서명 키 (openssl rand -hex 32 로 생성 권장)
#
# main 푸시 시 자동 배포는 꺼져있습니다 — Actions 탭에서 수동으로 "Run workflow"
# 실행해주세요 (Claude에게 "백엔드 배포해줘"라고 하면 대신 실행해드립니다).
#
# 항상 GitHub 호스팅 러너(ubuntu-latest)에서만 실행됩니다. self-hosted 러너 선택지는
# 없앴습니다 — OCI 서버에 실제로 러너가 등록돼 있다는 보장이 없는 상태에서 고르면
# 잡히는 러너가 없어 그냥 무한 대기하다 타임아웃되는 위험이 있고, build.yml(안드로이드/
# 백엔드 CI)도 처음부터 ubuntu-latest만 씁니다. SSH 스텝이 OCI_HOST로 직접 접속하므로
# 실행 위치가 GitHub이든 자체 러너든 배포 결과 자체는 동일합니다.

on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: ARM64 크로스 빌드 준비 (QEMU + buildx)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: buildx 빌더 준비
        uses: docker/setup-buildx-action@v3

      - name: 백엔드 이미지를 이 러너(무료 공용 인프라)에서 빌드 — OCI 서버는 컴파일 안 함
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          tags: safecircle-backend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 빌드된 이미지를 tar로 저장(압축) — OCI로 옮길 준비
        run: docker save safecircle-backend:latest | gzip > backend/safecircle-backend-image.tar.gz

      - name: 배포 디렉터리 준비 (없으면 생성 + 소유권 이전 — /opt은 기본적으로 root 소유)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          passphrase: ${{ secrets.OCI_SSH_PASSPHRASE }}
          script: |
            set -e
            sudo mkdir -p /opt/safecircle-backend
            sudo chown -R "$USER":"$USER" /opt/safecircle-backend

      - name: docker-compose.yml + 빌드된 이미지를 OCI로 전송 (소스 코드는 안 보냄)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          passphrase: ${{ secrets.OCI_SSH_PASSPHRASE }}
          source: "backend/docker-compose.yml,backend/safecircle-backend-image.tar.gz"
          target: "/opt/safecircle-backend"
          strip_components: 1
          overwrite: true

      - name: Docker 설치 확인 + .env 생성(최초 1회만) + 이미지 로드 + 컨테이너 기동
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          passphrase: ${{ secrets.OCI_SSH_PASSPHRASE }}
          envs: DATABASE_PASSWORD,JWT_SECRET
          script: |
            set -e

            echo "=== 1) Docker 설치 확인 ==="
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "$USER"
            fi
            if ! docker compose version >/dev/null 2>&1; then
              echo "❌ docker compose 플러그인이 없습니다. Docker 최신 버전을 설치했는지 확인해주세요."
              exit 1
            fi

            cd /opt/safecircle-backend

            echo "=== 2) .env 생성 (이미 있으면 절대 덮어쓰지 않음) ==="
            if [ ! -f .env ]; then
              cat > .env <<ENVEOF
            DATABASE_PASSWORD=${DATABASE_PASSWORD}
            JWT_SECRET=${JWT_SECRET}
            HOST_PORT=8090
            ENVEOF
              chmod 600 .env
              echo ".env 새로 생성함"
            else
              echo ".env 이미 있음 — 건드리지 않음 (비밀번호를 바꾸려면 서버에서 직접 수정하세요)"
            fi

            echo "=== 3) 미리 빌드된 이미지 로드 + 컨테이너 기동 (컴파일 없음) ==="
            sudo docker load < safecircle-backend-image.tar.gz
            rm -f safecircle-backend-image.tar.gz
            sudo docker compose up -d

            echo "=== 4) 헬스체크 (JVM 콜드스타트 대비 최대 60초 재시도) ==="
            HOST_PORT_V=$(grep -m1 '^HOST_PORT=' .env | cut -d= -f2)
            HOST_PORT_V=${HOST_PORT_V:-8090}
            ok=0
            for i in $(seq 1 12); do
              if curl -sf "http://127.0.0.1:${HOST_PORT_V}/health" > /dev/null; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" = "1" ]; then
              echo "✅ 헬스체크 통과"
            else
              echo "❌ 헬스체크 실패 — 아래는 최근 컨테이너 로그입니다"
              sudo docker compose logs --tail 100 api
              exit 1
            fi

            echo ""
            echo "다음 단계(수동, 최초 1회만): nginx에 이 포트(${HOST_PORT_V})를 프록시하는"
            echo "server 블록을 추가하고 도메인을 연결해야 외부에서 API에 접근할 수 있습니다."
            echo "(duruone의 oci-realtime-setup.yml이 /ws 위치를 추가한 것과 같은 방식)"
