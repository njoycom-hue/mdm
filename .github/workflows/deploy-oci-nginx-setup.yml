name: OCI nginx 도메인 연결 (mdm.duruone.com)

# SafeCircle 백엔드(현재 127.0.0.1:HOST_PORT에서만 로컬 접근 가능)를
# https://mdm.duruone.com 으로 외부에 노출하기 위한 최초 1회용 설정입니다.
# duruone의 oci-realtime-setup.yml과 같은 패턴: 여러 번 실행해도 안전(idempotent).
#
# TLS 인증서는 새로 발급하지 않고, duruone 메인 서버에 이미 배포되어 있는
# Cloudflare Origin 인증서(/etc/ssl/duruone/origin.pem, origin.key)를 그대로
# 재사용합니다 — Cloudflare Origin Cert는 기본적으로 *.duruone.com 와일드카드로
# 발급되는 경우가 많아 mdm.duruone.com도 커버될 가능성이 높습니다. 이 인증서가
# 없거나 mdm.duruone.com을 커버하지 않으면 아래 헬스체크 단계에서 바로 티가 납니다.
#
# 이 워크플로우가 끝난 뒤에도 실제로 접속되게 하려면 사용자가 직접 해야 하는 일이
# 하나 있습니다: Cloudflare DNS에서 mdm.duruone.com A레코드를 이 OCI 서버 공인 IP로
# 추가(프록시 on 권장, Origin Cert를 쓰려면 필수). 이건 이 워크플로우가 건드리지
# 않습니다 — duruone의 다른 provisioning 워크플로우들과 동일한 이유(DNS는 항상
# 수동 확인 후 전환).
#
# 사전 준비: OCI_HOST / OCI_USER / OCI_SSH_KEY / (필요시)OCI_SSH_PASSPHRASE
#           (deploy-oci.yml과 동일한 시크릿 재사용, 이미 등록되어 있음)

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "실행 러너"
        required: true
        type: choice
        options:
          - ubuntu-latest
          - self-hosted
        default: ubuntu-latest

jobs:
  setup-nginx:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - name: nginx server 블록 생성 + 인증서 확인 + reload
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          passphrase: ${{ secrets.OCI_SSH_PASSPHRASE }}
          script: |
            set -e

            echo "=== 1) 기존 duruone Cloudflare Origin 인증서 확인 ==="
            if [ ! -f /etc/ssl/duruone/origin.pem ] || [ ! -f /etc/ssl/duruone/origin.key ]; then
              echo "❌ /etc/ssl/duruone/origin.pem 또는 origin.key가 없습니다."
              echo "   duruone의 oci-provision-2-deploy.yml을 먼저 실행했는지,"
              echo "   또는 이 서버가 duruone 메인 서버가 맞는지 확인해주세요."
              exit 1
            fi
            echo "인증서 파일 확인됨"

            echo "=== 2) 배포된 HOST_PORT 값 읽기 ==="
            if [ ! -f /opt/safecircle-backend/.env ]; then
              echo "❌ /opt/safecircle-backend/.env가 없습니다 — deploy-oci.yml을 먼저 실행해 배포하세요."
              exit 1
            fi
            HOST_PORT_V=$(grep -m1 '^HOST_PORT=' /opt/safecircle-backend/.env | cut -d= -f2)
            HOST_PORT_V=${HOST_PORT_V:-8090}
            echo "HOST_PORT=${HOST_PORT_V}"

            echo "=== 3) nginx server 블록 작성 (mdm.duruone.com 전용, duruone.com 설정과 분리) ==="
            sudo tee /etc/nginx/sites-available/mdm.duruone.com > /dev/null <<NGINXCONF
            server {
                listen 80;
                server_name mdm.duruone.com;
                return 301 https://\$host\$request_uri;
            }

            server {
                listen 443 ssl;
                server_name mdm.duruone.com;

                ssl_certificate /etc/ssl/duruone/origin.pem;
                ssl_certificate_key /etc/ssl/duruone/origin.key;

                location / {
                    proxy_pass http://127.0.0.1:${HOST_PORT_V};
                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            NGINXCONF

            sudo ln -sf /etc/nginx/sites-available/mdm.duruone.com /etc/nginx/sites-enabled/mdm.duruone.com

            echo "=== 4) nginx 설정 검증 + reload ==="
            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "✅ nginx 설정 반영 완료"
            else
              echo "❌ nginx -t 실패 — sites-enabled/mdm.duruone.com 제거 후 원인 확인 필요"
              sudo rm -f /etc/nginx/sites-enabled/mdm.duruone.com
              exit 1
            fi

            echo "=== 5) 로컬 헬스체크 (Host 헤더로 가상호스트 테스트) ==="
            sleep 1
            curl -sf -H "Host: mdm.duruone.com" http://localhost/health && echo "" && echo "✅ 로컬 헬스체크 통과" \
              || echo "⚠️  로컬 헬스체크 실패 — nginx 설정은 반영됐지만 뭔가 더 확인 필요"

            echo ""
            echo "########################################################"
            echo "# 마지막 수동 단계 (Cloudflare 대시보드에서):"
            echo "# mdm.duruone.com -> 이 서버의 공인 IP로 A레코드 추가 (프록시 상태: On)"
            echo "# 완료 후 https://mdm.duruone.com/health 접속해서 OK 확인"
            echo "########################################################"
